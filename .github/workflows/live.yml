name: YouTube Live Stream
on:
  workflow_dispatch:
jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start Streaming
        run: |
          ffmpeg -re -stream_loop -1 -i "https://ia902808.us.archive.org/2/items/dlive/copy_B250B9C4-8E20-49FF-B7F4-97CA48372259.mov" \
          -vcodec libx264 -preset veryfast -maxrate 3000k -bufsize 6000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.STREAM_KEY }}"
